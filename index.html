                                <button onClick={() => setQuoteOpen(false)} className="text-slate-400 text-[10px] font-bold uppercase tracking-widest hover:text-slate-900 transition-colors block mx-auto">Return to Site</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const container = document.getElementById('root');
        if (container) {
            const root = createRoot(container);
            root.render(<App />);
        }
    </script>
</body>
</html>
